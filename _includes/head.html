<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}

<!-- Content Security Policy: whitelist known external script/resource domains -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https://www.googletagmanager.com;
  connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com;
">

<!-- Favicon -->
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Breezy Risk",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "publisher": { "@id": "{{ site.url }}/#organization" }
}
</script>

<!-- Site Identity Schema (canonical: ProfessionalService + Person) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "{{ site.url }}/#organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}",
      "logo": "{{ site.url }}/assets/images/breezy-logo.png",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "description": "{{ site.description }}",
      "foundingDate": "2024",
      "founder": { "@id": "{{ site.url }}/#joerg" },
      "email": "{{ site.email }}",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "{{ site.email }}"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "license",
          "name": "Insurance Producer License",
          "validIn": [
            { "@type": "State", "name": "Florida" },
            { "@type": "State", "name": "New Jersey" },
            { "@type": "State", "name": "New York" },
            { "@type": "State", "name": "Pennsylvania" }
          ]
        }
      ],
      "priceRange": "$$",
      "serviceType": [
        "Independent Insurance Advisory",
        "Insurance Audit",
        "Policy Review",
        "Risk Intelligence Report",
        "Coverage Gap Analysis",
        "Policy Interaction Analysis",
        "Cyber Insurance Analysis",
        "Fidelity Bond Analysis",
        "Directors and Officers (D&O) Analysis",
        "Insurance Advisory",
        "Carrier Technology Strategy",
        "MGA Operations Advisory",
        "AI and Emerging Risk Analysis",
        "Coverage Architecture"
      ],
      "slogan": "Independent insurance advisory. Carrier strategy, coverage architecture, and bank insurance audits.",
      "audience": [
        { "@type": "Audience", "audienceType": "Community Banks" },
        { "@type": "Audience", "audienceType": "Credit Unions" },
        { "@type": "Audience", "audienceType": "Insurance Carriers" },
        { "@type": "Audience", "audienceType": "Managing General Agents (MGAs)" },
        { "@type": "Audience", "audienceType": "Insurance Investors" }
      ],
      "knowsAbout": [
        "Community Bank Insurance",
        "Cyber Insurance",
        "Fidelity Bond",
        "D&O Insurance",
        "Wire Fraud Coverage",
        "Policy Interaction Analysis",
        "Insurance Technology",
        "Carrier Technology Strategy",
        "MGA Operations",
        "AI Liability Insurance",
        "Emerging Risk",
        "Parametric Insurance",
        "Coverage Architecture",
        "FDIC Examination",
        "FFIEC Guidance"
      ],
      "sameAs": [
        "https://www.linkedin.com/company/breezy-risk-advisors",
        "https://breezyrisk.substack.com"
      ]
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#joerg",
      "name": "{{ site.author }}",
      "jobTitle": "Founder & Principal",
      "url": "{{ site.url }}/about/",
      "image": "{{ site.url }}/assets/images/joerg-portrait.jpg",
      "description": "Founder and Principal of Breezy Risk. Insurance technology leader spanning carriers (Chubb, CNA), insurtech startups, and MGAs. Founded a parametric insurance startup. Served as COO of a cyber insurance MGA. Early career in cybersecurity at Siemens. Master's in Electrical Engineering, MBA from London Business School. Independent advisory practice covering insurance technology strategy, carrier operations, and bank insurance audits. Does not sell, place, or broker insurance.",
      "worksFor": { "@id": "{{ site.url }}/#organization" },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Karlsruhe Institute of Technology" },
        { "@type": "CollegeOrUniversity", "name": "London Business School" }
      ],
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "degree",
          "name": "MBA",
          "recognizedBy": { "@type": "EducationalOrganization", "name": "London Business School" }
        },
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "degree",
          "name": "Master's in Electrical Engineering"
        }
      ],
      "knowsAbout": [
        "Insurance Technology",
        "Carrier Technology Strategy",
        "MGA Operations",
        "AI Liability Insurance",
        "Cyber Insurance",
        "Community Bank Insurance",
        "D&O Insurance",
        "Fidelity Bond",
        "Policy Interaction Analysis",
        "Coverage Architecture",
        "Parametric Insurance",
        "Cybersecurity"
      ],
      "memberOf": [
        {
          "@type": "Organization",
          "name": "Pennsylvania Association of Community Bankers",
          "url": "https://www.pacb.org/"
        },
        {
          "@type": "Organization",
          "name": "Independent Bankers Association of New York State",
          "url": "https://ibanys.net/"
        }
      ],
      "sameAs": [
        "{{ site.linkedin }}"
      ]
    },
    {
      "@type": "OpinionNewsArticle",
      "@id": "{{ site.url }}/#bankthink-cyber-minefield",
      "headline": "Your bank's cyber insurance policies are a minefield of uncertainty",
      "url": "https://www.americanbanker.com/opinion/your-banks-cyber-insurance-policies-are-a-minefield-of-uncertainty",
      "datePublished": "2026-07-28",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "author": { "@id": "{{ site.url }}/#joerg" },
      "publisher": {
        "@type": "NewsMediaOrganization",
        "name": "American Banker",
        "url": "https://www.americanbanker.com"
      }
    }
  ]
}
</script>
